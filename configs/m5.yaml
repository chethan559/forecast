# M5 (Walmart) daily sales, aggregated to Monday weeks by src/adapters/m5.py.
# Data (not in the repo): Kaggle "M5 Forecasting - Accuracy" -> data/raw/m5/
#   sales_train_evaluation.csv, calendar.csv, sell_prices.csv
# Generalisation test (src/experiment_m5.py): every model, feature and threshold setting is the VN1 default.
# Only what the data force differs: hierarchy, item column, paths, the sealed weeks and the series sample.

dataset:
  name: m5
  adapter: m5
  adapter_args:
    sales_file: sales_train_evaluation.csv
    calendar_file: calendar.csv
    prices_file: sell_prices.csv
    max_series: null
  hierarchy: [state_id, store_id, cat_id, dept_id]
  item_column: item_id         # same item across stores
  group_level: store_id        # set before any M5 modelling (the store is the selling unit, like a VN1 client)
  calendar: us

paths:
  raw_dir: data/raw/m5
  processed_dir: data/processed/m5
  reports_dir: reports/m5
  outputs_dir: outputs/m5
  artifacts_dir: artifacts/m5

# Sealed test: the last 13 complete Monday weeks (2016-02-22 .. 2016-05-16). Dates only, from the data shape.
max_allowed_date: "2016-02-15"
seal: {weeks: 13, first_week: "2016-02-22", last_week: "2016-05-16"}

experiment:
  # 30,490 series x the VN1 training-origin rule = ~33M training rows, which does not fit in 8 GB.
  # A fixed random sample keeps the training set at VN1's size (~7.7M rows). Chosen before any result.
  sample_series: 7000
  sample_seed: 0

smoothing:
  enabled: true                # VN1 default: detect automatically
  # Found by the changepoint on the weekly repeat rate in the prepare step, then pinned (same procedure as VN1).
  # Not a real smoothed era: the repeat rate goes UP after it (10.9% -> 12.0%; VN1: 20.0% -> 10.1%).
  switch_date: "2014-03-17"

backtest:
  folds: {}                    # automatic rolling folds (backtest.auto_folds, src/folds.py)
